# Self-build for a LibreTube fork: optimized release APK, signed so it installs.
# Put this file at .github/workflows/build-apk.yml in your fork.
#
# Signing:
#  - Without secrets, each run signs with a NEW one-time key (APK installs fine,
#    but a later build cannot update over it: uninstall first).
#  - For a fixed key (updates keep your data), add repo secrets:
#      KEYSTORE_BASE64   base64 of a .jks keystore
#      KEYSTORE_PASSWORD store and key password (same value)
#      KEYSTORE_ALIAS    key alias (optional, default "key")
name: Build APK (self)

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/key.jks"
            pw="$KEYSTORE_PASSWORD"
            alias="${KEYSTORE_ALIAS:-key}"
          else
            echo "::warning::No KEYSTORE_BASE64 secret, signing with a one-time key. Uninstall the previous build before installing this one."
            pw=$(openssl rand -hex 16)
            alias=key
            keytool -genkeypair -keystore "$RUNNER_TEMP/key.jks" -storepass "$pw" -keypass "$pw" \
              -alias "$alias" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=LibreTube self-build"
          fi
          echo "::add-mask::$pw"
          echo "KS_PASS=$pw" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          for apk in app/build/outputs/apk/release/*-unsigned.apk; do
            name=$(basename "$apk" -unsigned.apk)
            "$BT/zipalign" -p -f 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/key.jks" --ks-pass env:KS_PASS \
              --key-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out "out/$name.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify "out/$name.apk"
          done
          rm -f "$RUNNER_TEMP/key.jks"
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: libretube-apk
          path: out/*.apk
          if-no-files-found: error
